name: Production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_drill:
        description: Deploy a marker release, then roll back to the exact main revision
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    outputs:
      project_id: ${{ steps.railway.outputs.project_id }}
      service_id: ${{ steps.railway.outputs.service_id }}
      origin: ${{ steps.railway.outputs.origin }}
      previous_id: ${{ steps.before.outputs.previous_id }}
      previous_revision: ${{ steps.before.outputs.revision }}
      deployment_id: ${{ steps.wait.outputs.deployment_id }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
      CONFIGURED_RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      CONFIGURED_PUBLIC_ORIGIN: ${{ vars.BACKEND_PUBLIC_ORIGIN }}
      CONFIGURED_FRONTEND_ORIGIN: ${{ vars.FRONTEND_PUBLIC_ORIGIN }}
      CONFIGURED_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      CONFIGURED_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      CONFIGURED_VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      EXPECTED_DEPLOY_REVISION: ${{ github.sha }}
      ROLLBACK_DRILL: ${{ inputs.rollback_drill || false }}
    steps:
      - name: Initialize deployment failure evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backend-deployment"
          printf '%s\n' '{"status":"initialized","stage":"job"}' > "$RUNNER_TEMP/backend-deployment/status.json"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the checksum-pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          railway_deb=/tmp/railway-v5.41.2-amd64.deb
          curl --fail --silent --show-error --location \
            --output "$railway_deb" \
            https://github.com/railwayapp/cli/releases/download/v5.41.2/railway-v5.41.2-amd64.deb
          printf '%s  %s\n' \
            a66321d03f8970db2be727ca9b8861b6e55a788f81c5864ff367432b22a9d8e8 \
            "$railway_deb" | sha256sum --check --strict
          sudo dpkg --install "$railway_deb"
          test "$(railway --version)" = "railway 5.41.2"

      - name: Require the trusted Railway credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAILWAY_TOKEN" || { echo "::error::RAILWAY_TOKEN is missing from the production environment"; exit 1; }
          test -n "$RAILWAY_SSH_PRIVATE_KEY" || { echo "::error::RAILWAY_SSH_PRIVATE_KEY is missing from the production environment"; exit 1; }
          test -n "$CONFIGURED_RAILWAY_PROJECT_ID" || { echo "::error::RAILWAY_PROJECT_ID is missing from the production environment"; exit 1; }
          test -n "$CONFIGURED_FRONTEND_ORIGIN" || { echo "::error::FRONTEND_PUBLIC_ORIGIN is missing from the production environment"; exit 1; }
          test -n "$CONFIGURED_VAPID_PRIVATE_KEY" || { echo "::error::VAPID_PRIVATE_KEY is missing from the production environment"; exit 1; }
          test -n "$CONFIGURED_VAPID_PUBLIC_KEY" || { echo "::error::VAPID_PUBLIC_KEY is missing from the production environment"; exit 1; }
          test -n "$CONFIGURED_VAPID_SUBJECT" || { echo "::error::VAPID_SUBJECT is missing from the production environment"; exit 1; }

      - name: Provision the dedicated noninteractive Railway SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          RAILWAY_SSH_IDENTITY="$RUNNER_TEMP/railway-ci-ssh"
          RAILWAY_SSH_KNOWN_HOSTS="$RUNNER_TEMP/railway-known-hosts"
          printf '%s\n' "$RAILWAY_SSH_PRIVATE_KEY" > "$RAILWAY_SSH_IDENTITY"
          chmod 600 "$RAILWAY_SSH_IDENTITY"
          install -d -m 700 "$HOME/.ssh"
          install -m 600 scripts/deploy/railway_known_hosts "$RAILWAY_SSH_KNOWN_HOSTS"
          test "$(ssh-keygen -lf "$RAILWAY_SSH_KNOWN_HOSTS" | cut -d' ' -f2)" = \
            "SHA256:+S1xg92FrnHz6pY3bpkmh1OGtWQGNANXilPzlxA7B1g"
          cat >> "$HOME/.ssh/config" <<EOF
          Host ssh.railway.com
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $RAILWAY_SSH_KNOWN_HOSTS
          EOF
          chmod 600 "$HOME/.ssh/config"
          printf 'RAILWAY_SSH_IDENTITY=%s\n' "$RAILWAY_SSH_IDENTITY" >> "$GITHUB_ENV"
          printf 'RAILWAY_SSH_KNOWN_HOSTS=%s\n' "$RAILWAY_SSH_KNOWN_HOSTS" >> "$GITHUB_ENV"

      - name: Discover the exact backend service and public origin
        id: railway
        run: |
          set -euo pipefail
          mkdir -p artifacts/backend-deployment
          python3 scripts/deploy/railway_release.py discover \
            --project-id "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --service-name backend \
            --environment production \
            --origin "$CONFIGURED_PUBLIC_ORIGIN" \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV" \
            --evidence-output artifacts/backend-deployment/discovery.json

      - name: Record the active backend deployment before cutover
        id: before
        run: |
          set -euo pipefail
          mkdir -p artifacts/backend-deployment
          python3 scripts/deploy/railway_release.py snapshot \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --output artifacts/backend-deployment/before.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"
          python3 scripts/deploy/railway_release.py capture-revision \
            --origin "$PUBLIC_ORIGIN" \
            --allow-missing \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Attach the exact revision, origin, and Web Push configuration to the backend release
        run: |
          set -euo pipefail
          railway variable set \
            "DEPLOY_REVISION=$GITHUB_SHA" \
            "FRONTEND_ORIGIN=$CONFIGURED_FRONTEND_ORIGIN" \
            "VAPID_PRIVATE_KEY=$CONFIGURED_VAPID_PRIVATE_KEY" \
            "VAPID_PUBLIC_KEY=$CONFIGURED_VAPID_PUBLIC_KEY" \
            "VAPID_SUBJECT=$CONFIGURED_VAPID_SUBJECT" \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production

      - name: Upload the exact backend revision
        id: deploy
        run: |
          set -euo pipefail
          railway up backend --path-as-root --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --message "GitHub $GITHUB_SHA" | tee artifacts/backend-deployment/upload.json

      - name: Poll the backend deployment to terminal success
        id: wait
        run: |
          set -euo pipefail
          python3 scripts/deploy/railway_release.py wait-deployment \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --before artifacts/backend-deployment/before.json \
            --output artifacts/backend-deployment/deployed.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Verify the exact backend revision and backing-service health
        run: |
          set -euo pipefail
          python3 scripts/deploy/railway_release.py wait-revision \
            --origin "$PUBLIC_ORIGIN" \
            --expected "$GITHUB_SHA" \
            --output artifacts/backend-deployment/cutover.json
          curl --fail --silent --show-error "$PUBLIC_ORIGIN/health" \
            --output artifacts/backend-deployment/health.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("artifacts/backend-deployment/health.json").read_text())
          expected = {"status": "healthy", "database": "connected", "redis": "connected"}
          if health != expected:
              raise SystemExit(f"backend health mismatch: {health!r}")
          PY

      - name: Run the production synchronization path and verify the live Snapshot
        run: |
          set -euo pipefail
          timeout 600 railway ssh \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --identity-file "$RAILWAY_SSH_IDENTITY" \
            .venv/bin/python -m app.sync \
            | tee artifacts/backend-deployment/sync.log
          curl --fail --silent --show-error "$PUBLIC_ORIGIN/freshness" \
            --output artifacts/backend-deployment/freshness.json
          curl --fail --silent --show-error "$PUBLIC_ORIGIN/ingestion-health" \
            --output artifacts/backend-deployment/ingestion-health.json
          curl --fail --silent --show-error "$PUBLIC_ORIGIN/events?page_size=1" \
            --output artifacts/backend-deployment/events.json
          timeout 60 railway ssh \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --identity-file "$RAILWAY_SSH_IDENTITY" \
            .venv/bin/python -m app.verify_snapshot \
            > artifacts/backend-deployment/database-snapshot.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          freshness = json.loads(Path("artifacts/backend-deployment/freshness.json").read_text())
          ingestion = json.loads(Path("artifacts/backend-deployment/ingestion-health.json").read_text())
          events = json.loads(Path("artifacts/backend-deployment/events.json").read_text())
          database = json.loads(Path("artifacts/backend-deployment/database-snapshot.json").read_text())
          if freshness["is_stale"]["value"] is not False:
              raise SystemExit(f"production Snapshot is stale: {freshness!r}")
          if not freshness["snapshot_row_count"]["value"]:
              raise SystemExit(f"production Snapshot is empty: {freshness!r}")
          if not events.get("events") or not events["events"][0].get("guid"):
              raise SystemExit(f"production API has no source guid: {events!r}")
          if ingestion.get("status") != "succeeded" or ingestion.get("row_count", 0) <= 0:
              raise SystemExit(f"production ingestion is not healthy: {ingestion!r}")
          if database.get("row_count") != freshness["snapshot_row_count"]["value"]:
              raise SystemExit("database and freshness row counts differ")
          if database.get("first_guid") != events["events"][0]["guid"]:
              raise SystemExit("database and API first Event GUIDs differ")
          PY

      - name: Remove the Railway SSH identity from the runner
        if: always()
        shell: bash
        run: rm -f "$RAILWAY_SSH_IDENTITY" "$RAILWAY_SSH_KNOWN_HOSTS"

      - name: Snapshot the verified backend before the rollback drill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill }}
        run: |
          python3 scripts/deploy/railway_release.py snapshot \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --output artifacts/backend-deployment/drill-before.json

      - name: Deploy a backend rollback-drill marker
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill }}
        env:
          DRILL_REVISION: ${{ github.sha }}-backend-rollback-drill
        run: |
          set -euo pipefail
          railway variable set "DEPLOY_REVISION=$DRILL_REVISION" --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production
          railway up backend --path-as-root --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --message "rollback drill $DRILL_REVISION" | tee artifacts/backend-deployment/drill-upload.json
          python3 scripts/deploy/railway_release.py wait-deployment \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --before artifacts/backend-deployment/drill-before.json \
            --output artifacts/backend-deployment/drill-deployed.json
          python3 scripts/deploy/railway_release.py wait-revision \
            --origin "$PUBLIC_ORIGIN" \
            --expected "$DRILL_REVISION" \
            --output artifacts/backend-deployment/drill-cutover.json

      - name: Roll back the backend drill marker to the verified main deployment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill }}
        run: |
          set -euo pipefail
          python3 scripts/deploy/railway_release.py snapshot \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --output artifacts/backend-deployment/drill-rollback-before.json
          railway api "mutation(\$id: String!) { deploymentRollback(id: \$id) }" \
            --var id="$DEPLOYMENT_ID" \
            > artifacts/backend-deployment/drill-rollback.json
          python3 scripts/deploy/railway_release.py wait-deployment \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --before artifacts/backend-deployment/drill-rollback-before.json \
            --output artifacts/backend-deployment/drill-rollback-deployed.json
          python3 scripts/deploy/railway_release.py wait-revision \
            --origin "$PUBLIC_ORIGIN" \
            --expected "$GITHUB_SHA" \
            --output artifacts/backend-deployment/drill-rollback-cutover.json
          curl --fail --silent --show-error "$PUBLIC_ORIGIN/health" \
            --output artifacts/backend-deployment/drill-rollback-health.json

      - name: Roll back a failed backend deployment or smoke
        if: ${{ failure() && steps.deploy.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          test -n "$PREVIOUS_DEPLOYMENT_ID" || { echo "::error::no backend rollback target exists"; exit 1; }
          test -n "$PREVIOUS_REVISION" || { echo "::error::no exact backend rollback revision exists"; exit 1; }
          python3 scripts/deploy/railway_release.py snapshot \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --output artifacts/backend-deployment/failure-rollback-before.json
          railway api "mutation(\$id: String!) { deploymentRollback(id: \$id) }" \
            --var id="$PREVIOUS_DEPLOYMENT_ID" > artifacts/backend-deployment/failure-rollback.json
          python3 scripts/deploy/railway_release.py wait-deployment \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --before artifacts/backend-deployment/failure-rollback-before.json \
            --output artifacts/backend-deployment/failure-rollback-deployed.json
          python3 scripts/deploy/railway_release.py wait-revision \
            --origin "$PUBLIC_ORIGIN" \
            --expected "$PREVIOUS_REVISION" \
            --output artifacts/backend-deployment/failure-rollback-cutover.json

      - name: Upload backend deployment and rollback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-backend-${{ github.sha }}
          path: |
            ${{ runner.temp }}/backend-deployment/
            artifacts/backend-deployment/
          if-no-files-found: error

  deploy-sync-worker:
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    outputs:
      previous_id: ${{ steps.before.outputs.previous_id }}
      deployment_id: ${{ steps.wait.outputs.deployment_id }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.RAILWAY_SSH_PRIVATE_KEY }}
      CONFIGURED_RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      BACKEND_PUBLIC_ORIGIN: ${{ needs.deploy-backend.outputs.origin }}
      EXPECTED_DEPLOY_REVISION: ${{ github.sha }}
    steps:
      - name: Initialize deployment failure evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sync-worker"
          printf '%s\n' '{"status":"initialized","stage":"job"}' > "$RUNNER_TEMP/sync-worker/status.json"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install the checksum-pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          railway_deb=/tmp/railway-v5.41.2-amd64.deb
          curl --fail --silent --show-error --location \
            --output "$railway_deb" \
            https://github.com/railwayapp/cli/releases/download/v5.41.2/railway-v5.41.2-amd64.deb
          printf '%s  %s\n' \
            a66321d03f8970db2be727ca9b8861b6e55a788f81c5864ff367432b22a9d8e8 \
            "$railway_deb" | sha256sum --check --strict
          sudo dpkg --install "$railway_deb"
          test "$(railway --version)" = "railway 5.41.2"

      - name: Require the trusted Railway credential
        run: |
          set -euo pipefail
          test -n "$RAILWAY_TOKEN" || { echo "::error::RAILWAY_TOKEN is missing"; exit 1; }
          test -n "$CONFIGURED_RAILWAY_PROJECT_ID" || { echo "::error::RAILWAY_PROJECT_ID is missing"; exit 1; }

      - name: Create or reconcile the scheduled synchronization service
        id: worker
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/sync-worker
          python3 scripts/deploy/railway_release.py configure-sync-worker \
            --project-id "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --environment production \
            --service-name sync-worker \
            --backend-service backend \
            --config backend/railway-sync.toml \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV" \
            --evidence-output artifacts/sync-worker/configuration.json

      - name: Record the previous scheduled-worker deployment
        id: before
        run: |
          python3 scripts/deploy/railway_release.py snapshot \
            --project "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --service "$SYNC_RAILWAY_SERVICE_ID" \
            --environment production \
            --output artifacts/sync-worker/before.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Upload the exact worker revision without backend service config
        id: deploy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sync-worker-source"
          rsync -a --exclude railway.toml backend/ "$RUNNER_TEMP/sync-worker-source/"
          railway variable set "DEPLOY_REVISION=$GITHUB_SHA" --skip-deploys \
            --project "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --service "$SYNC_RAILWAY_SERVICE_ID" \
            --environment production
          railway up "$RUNNER_TEMP/sync-worker-source" --path-as-root --detach --json \
            --project "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --service "$SYNC_RAILWAY_SERVICE_ID" \
            --environment production \
            --message "Scheduled sync GitHub $GITHUB_SHA" \
            | tee artifacts/sync-worker/upload.json

      - name: Poll the worker deployment to terminal success
        id: wait
        run: |
          python3 scripts/deploy/railway_release.py wait-deployment \
            --project "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --service "$SYNC_RAILWAY_SERVICE_ID" \
            --environment production \
            --before artifacts/sync-worker/before.json \
            --output artifacts/sync-worker/deployed.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Prove the worker variable names and exact revision
        run: |
          set -euo pipefail
          python3 scripts/deploy/railway_release.py verify-sync-worker-variables \
            --project-id "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --environment production \
            --service "$SYNC_RAILWAY_SERVICE_ID" \
            --backend-service backend \
            --required-variable-name REDIS_URL \
            --expected-revision "$EXPECTED_DEPLOY_REVISION" \
            --output artifacts/sync-worker/variables.json

      - name: Provision the dedicated noninteractive Railway SSH identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          RAILWAY_SSH_IDENTITY="$RUNNER_TEMP/railway-ci-ssh"
          RAILWAY_SSH_KNOWN_HOSTS="$RUNNER_TEMP/railway-known-hosts"
          printf '%s\n' "$RAILWAY_SSH_PRIVATE_KEY" > "$RAILWAY_SSH_IDENTITY"
          chmod 600 "$RAILWAY_SSH_IDENTITY"
          install -d -m 700 "$HOME/.ssh"
          install -m 600 scripts/deploy/railway_known_hosts "$RAILWAY_SSH_KNOWN_HOSTS"
          test "$(ssh-keygen -lf "$RAILWAY_SSH_KNOWN_HOSTS" | cut -d' ' -f2)" = \
            "SHA256:+S1xg92FrnHz6pY3bpkmh1OGtWQGNANXilPzlxA7B1g"
          cat >> "$HOME/.ssh/config" <<EOF
          Host ssh.railway.com
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $RAILWAY_SSH_KNOWN_HOSTS
          EOF
          chmod 600 "$HOME/.ssh/config"
          printf 'RAILWAY_SSH_IDENTITY=%s\n' "$RAILWAY_SSH_IDENTITY" >> "$GITHUB_ENV"
          printf 'RAILWAY_SSH_KNOWN_HOSTS=%s\n' "$RAILWAY_SSH_KNOWN_HOSTS" >> "$GITHUB_ENV"

      - name: Run the exact scheduled worker and prove its successful Sync Run
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND_PUBLIC_ORIGIN/freshness" \
            --output artifacts/sync-worker/freshness-before.json
          timeout 60 railway ssh \
            --project "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --service "$SYNC_RAILWAY_SERVICE_ID" \
            --environment production \
            --identity-file "$RAILWAY_SSH_IDENTITY" \
            printenv DEPLOY_REVISION \
            > artifacts/sync-worker/worker-revision.txt
          test "$(tr -d '\r\n' < artifacts/sync-worker/worker-revision.txt)" = \
            "$EXPECTED_DEPLOY_REVISION"
          timeout 600 railway ssh \
            --project "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --service "$SYNC_RAILWAY_SERVICE_ID" \
            --environment production \
            --identity-file "$RAILWAY_SSH_IDENTITY" \
            .venv/bin/python -m app.sync \
            | tee artifacts/sync-worker/sync.log
          curl --fail --silent --show-error "$BACKEND_PUBLIC_ORIGIN/freshness" \
            --output artifacts/sync-worker/freshness-after.json
          python3 - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          root = Path("artifacts/sync-worker")
          before = json.loads((root / "freshness-before.json").read_text())
          after = json.loads((root / "freshness-after.json").read_text())
          before_sync = datetime.fromisoformat(before["last_successful_sync"]["value"])
          after_sync = datetime.fromisoformat(after["last_successful_sync"]["value"])
          if after_sync <= before_sync:
              raise SystemExit("scheduled worker did not record a new successful Sync Run")
          if after["is_stale"]["value"] is not False:
              raise SystemExit("scheduled worker freshness is stale")
          if after["snapshot_row_count"]["value"] <= 0:
              raise SystemExit("scheduled worker produced an empty Snapshot")
          evidence = {
              "status": "success",
              "revision": (root / "worker-revision.txt").read_text().strip(),
              "previousSuccessfulSync": before_sync.isoformat(),
              "successfulSync": after_sync.isoformat(),
              "snapshotRowCount": after["snapshot_row_count"]["value"],
              "isStale": False,
          }
          (root / "smoke.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY

      - name: Remove the Railway SSH identity from the runner
        if: always()
        shell: bash
        run: rm -f "$RAILWAY_SSH_IDENTITY" "$RAILWAY_SSH_KNOWN_HOSTS"

      - name: Roll back worker and backend when the scheduled deployment fails
        if: ${{ failure() && steps.deploy.outcome != 'skipped' }}
        env:
          BACKEND_PUBLIC_ORIGIN: ${{ needs.deploy-backend.outputs.origin }}
          BACKEND_RAILWAY_SERVICE_ID: ${{ needs.deploy-backend.outputs.service_id }}
          BACKEND_PREVIOUS_DEPLOYMENT_ID: ${{ needs.deploy-backend.outputs.previous_id }}
          BACKEND_PREVIOUS_REVISION: ${{ needs.deploy-backend.outputs.previous_revision }}
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS_DEPLOYMENT_ID" ]; then
            python3 scripts/deploy/railway_release.py snapshot \
              --project "$CONFIGURED_RAILWAY_PROJECT_ID" \
              --service "$SYNC_RAILWAY_SERVICE_ID" \
              --environment production \
              --output artifacts/sync-worker/failure-rollback-before.json
            railway api "mutation(\$id: String!) { deploymentRollback(id: \$id) }" \
              --var id="$PREVIOUS_DEPLOYMENT_ID" > artifacts/sync-worker/failure-rollback.json
            python3 scripts/deploy/railway_release.py wait-deployment \
              --project "$CONFIGURED_RAILWAY_PROJECT_ID" \
              --service "$SYNC_RAILWAY_SERVICE_ID" \
              --environment production \
              --before artifacts/sync-worker/failure-rollback-before.json \
              --output artifacts/sync-worker/failure-rollback-deployed.json
          fi
          test -n "$BACKEND_PREVIOUS_DEPLOYMENT_ID" || { echo "::error::no backend rollback target"; exit 1; }
          test -n "$BACKEND_RAILWAY_SERVICE_ID" || { echo "::error::no backend service exists"; exit 1; }
          test -n "$BACKEND_PREVIOUS_REVISION" || { echo "::error::no exact backend rollback revision exists"; exit 1; }
          python3 scripts/deploy/railway_release.py snapshot \
            --project "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --service "$BACKEND_RAILWAY_SERVICE_ID" \
            --environment production \
            --output artifacts/sync-worker/failure-backend-rollback-before.json
          railway api "mutation(\$id: String!) { deploymentRollback(id: \$id) }" \
            --var id="$BACKEND_PREVIOUS_DEPLOYMENT_ID" \
            > artifacts/sync-worker/failure-backend-rollback.json
          python3 scripts/deploy/railway_release.py wait-deployment \
            --project "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --service "$BACKEND_RAILWAY_SERVICE_ID" \
            --environment production \
            --before artifacts/sync-worker/failure-backend-rollback-before.json \
            --output artifacts/sync-worker/failure-backend-rollback-deployed.json
          python3 scripts/deploy/railway_release.py wait-revision \
            --origin "$BACKEND_PUBLIC_ORIGIN" \
            --expected "$BACKEND_PREVIOUS_REVISION" \
            --output artifacts/sync-worker/failure-backend-rollback-cutover.json

      - name: Upload scheduled-worker deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-sync-worker-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sync-worker/
            artifacts/sync-worker/
          if-no-files-found: error

  deploy-frontend:
    needs: [deploy-backend, deploy-sync-worker]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      CONFIGURED_RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      CONFIGURED_PUBLIC_ORIGIN: ${{ vars.FRONTEND_PUBLIC_ORIGIN }}
      BACKEND_PUBLIC_ORIGIN: ${{ needs.deploy-backend.outputs.origin }}
      EXPECTED_DEPLOY_REVISION: ${{ github.sha }}
      ROLLBACK_DRILL: ${{ inputs.rollback_drill || false }}
    steps:
      - name: Initialize deployment failure evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frontend-deployment"
          printf '%s\n' '{"status":"initialized","stage":"job"}' > "$RUNNER_TEMP/frontend-deployment/status.json"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the checksum-pinned Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          railway_deb=/tmp/railway-v5.41.2-amd64.deb
          curl --fail --silent --show-error --location \
            --output "$railway_deb" \
            https://github.com/railwayapp/cli/releases/download/v5.41.2/railway-v5.41.2-amd64.deb
          printf '%s  %s\n' \
            a66321d03f8970db2be727ca9b8861b6e55a788f81c5864ff367432b22a9d8e8 \
            "$railway_deb" | sha256sum --check --strict
          sudo dpkg --install "$railway_deb"
          test "$(railway --version)" = "railway 5.41.2"

      - name: Require the trusted Railway credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAILWAY_TOKEN" || { echo "::error::RAILWAY_TOKEN is missing from the production environment"; exit 1; }
          test -n "$CONFIGURED_RAILWAY_PROJECT_ID" || { echo "::error::RAILWAY_PROJECT_ID is missing from the production environment"; exit 1; }

      - name: Install locked browser and deployment tooling
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Discover the exact Railway project, service, and public origin
        id: railway
        run: |
          set -euo pipefail
          mkdir -p artifacts/deployment
          python3 scripts/deploy/railway_release.py discover \
            --project-id "$CONFIGURED_RAILWAY_PROJECT_ID" \
            --service-name frontend \
            --environment production \
            --origin "$CONFIGURED_PUBLIC_ORIGIN" \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV" \
            --evidence-output artifacts/deployment/discovery.json

      - name: Record the active deployment and revision before cutover
        id: before
        run: |
          set -euo pipefail
          mkdir -p artifacts/deployment
          python3 scripts/deploy/railway_release.py snapshot \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --output artifacts/deployment/before.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"
          python3 scripts/deploy/railway_release.py capture-revision \
            --origin "$PUBLIC_ORIGIN" \
            --allow-missing \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Attach the exact revision and backend API origin to the Railway release
        run: |
          set -euo pipefail
          test -n "$BACKEND_PUBLIC_ORIGIN" || { echo "::error::backend origin is missing"; exit 1; }
          railway variable set \
            "DEPLOY_REVISION=$GITHUB_SHA" \
            "API_BASE_URL=$BACKEND_PUBLIC_ORIGIN" \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production

      - name: Attach the Clerk keys to the Railway release
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" || { echo "::error::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is missing from the production environment"; exit 1; }
          test -n "$CLERK_SECRET_KEY" || { echo "::error::CLERK_SECRET_KEY is missing from the production environment"; exit 1; }
          railway variable set \
            "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" \
            "CLERK_SECRET_KEY=$CLERK_SECRET_KEY" \
            --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production

      - name: Upload the exact frontend revision
        id: deploy
        run: |
          set -euo pipefail
          railway up frontend --path-as-root --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --message "GitHub $GITHUB_SHA" | tee artifacts/deployment/upload.json

      - name: Poll Railway to terminal success
        id: wait
        run: |
          set -euo pipefail
          python3 scripts/deploy/railway_release.py wait-deployment \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --before artifacts/deployment/before.json \
            --output artifacts/deployment/deployed.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-env "$GITHUB_ENV"

      - name: Verify exact public cutover revision
        run: |
          python3 scripts/deploy/railway_release.py wait-revision \
            --origin "$PUBLIC_ORIGIN" \
            --expected "$GITHUB_SHA" \
            --output artifacts/deployment/cutover.json

      - name: Run production Playwright at 390x844 and 1440x900
        working-directory: frontend
        run: PLAYWRIGHT_BASE_URL="$PUBLIC_ORIGIN" npm run test:production

      - name: Snapshot the verified target before the rollback drill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill }}
        run: |
          python3 scripts/deploy/railway_release.py snapshot \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --output artifacts/deployment/drill-before.json

      - name: Deploy a rollback-drill marker
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill }}
        env:
          DRILL_REVISION: ${{ github.sha }}-rollback-drill
        run: |
          set -euo pipefail
          railway variable set "DEPLOY_REVISION=$DRILL_REVISION" --skip-deploys \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production
          railway up frontend --path-as-root --detach --json \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --message "rollback drill $DRILL_REVISION" | tee artifacts/deployment/drill-upload.json
          python3 scripts/deploy/railway_release.py wait-deployment \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --before artifacts/deployment/drill-before.json \
            --output artifacts/deployment/drill-deployed.json
          python3 scripts/deploy/railway_release.py wait-revision \
            --origin "$PUBLIC_ORIGIN" \
            --expected "$DRILL_REVISION" \
            --output artifacts/deployment/drill-cutover.json

      - name: Roll back the drill marker to the verified main deployment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill }}
        run: |
          set -euo pipefail
          python3 scripts/deploy/railway_release.py snapshot \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --output artifacts/deployment/drill-rollback-before.json
          railway api "mutation(\$id: String!) { deploymentRollback(id: \$id) }" \
            --var id="$DEPLOYMENT_ID" \
            > artifacts/deployment/drill-rollback.json
          python3 scripts/deploy/railway_release.py wait-deployment \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --before artifacts/deployment/drill-rollback-before.json \
            --output artifacts/deployment/drill-rollback-deployed.json
          python3 scripts/deploy/railway_release.py wait-revision \
            --origin "$PUBLIC_ORIGIN" \
            --expected "$GITHUB_SHA" \
            --output artifacts/deployment/drill-rollback-cutover.json

      - name: Re-run production Playwright after rollback
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_drill }}
        working-directory: frontend
        run: PLAYWRIGHT_BASE_URL="$PUBLIC_ORIGIN" npm run test:production

      - name: Roll back any failed deployment or smoke
        if: ${{ failure() && steps.deploy.outcome != 'skipped' }}
        env:
          BACKEND_PUBLIC_ORIGIN: ${{ needs.deploy-backend.outputs.origin }}
          BACKEND_RAILWAY_SERVICE_ID: ${{ needs.deploy-backend.outputs.service_id }}
          BACKEND_PREVIOUS_DEPLOYMENT_ID: ${{ needs.deploy-backend.outputs.previous_id }}
          BACKEND_PREVIOUS_REVISION: ${{ needs.deploy-backend.outputs.previous_revision }}
        run: |
          set -euo pipefail
          test -n "$PREVIOUS_DEPLOYMENT_ID" || { echo "::error::no rollback target exists"; exit 1; }
          test -n "$PREVIOUS_REVISION" || { echo "::error::no exact frontend rollback revision exists"; exit 1; }
          python3 scripts/deploy/railway_release.py snapshot \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --output artifacts/deployment/failure-rollback-before.json
          railway api "mutation(\$id: String!) { deploymentRollback(id: \$id) }" \
            --var id="$PREVIOUS_DEPLOYMENT_ID" > artifacts/deployment/failure-rollback.json
          python3 scripts/deploy/railway_release.py wait-deployment \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --environment production \
            --before artifacts/deployment/failure-rollback-before.json \
            --output artifacts/deployment/failure-rollback-deployed.json
          python3 scripts/deploy/railway_release.py wait-revision \
            --origin "$PUBLIC_ORIGIN" \
            --expected "$PREVIOUS_REVISION" \
            --output artifacts/deployment/failure-rollback-cutover.json
          test -n "$BACKEND_PREVIOUS_DEPLOYMENT_ID" || { echo "::error::no backend rollback target exists"; exit 1; }
          test -n "$BACKEND_RAILWAY_SERVICE_ID" || { echo "::error::no backend service exists"; exit 1; }
          test -n "$BACKEND_PREVIOUS_REVISION" || { echo "::error::no exact backend rollback revision exists"; exit 1; }
          python3 scripts/deploy/railway_release.py snapshot \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$BACKEND_RAILWAY_SERVICE_ID" \
            --environment production \
            --output artifacts/deployment/failure-backend-rollback-before.json
          railway api "mutation(\$id: String!) { deploymentRollback(id: \$id) }" \
            --var id="$BACKEND_PREVIOUS_DEPLOYMENT_ID" \
            > artifacts/deployment/failure-backend-rollback.json
          python3 scripts/deploy/railway_release.py wait-deployment \
            --project "$RAILWAY_PROJECT_ID" \
            --service "$BACKEND_RAILWAY_SERVICE_ID" \
            --environment production \
            --before artifacts/deployment/failure-backend-rollback-before.json \
            --output artifacts/deployment/failure-backend-rollback-deployed.json
          python3 scripts/deploy/railway_release.py wait-revision \
            --origin "$BACKEND_PUBLIC_ORIGIN" \
            --expected "$BACKEND_PREVIOUS_REVISION" \
            --output artifacts/deployment/failure-backend-rollback-cutover.json

      - name: Write deployment summary
        if: always()
        env:
          BACKEND_SUMMARY_ORIGIN: ${{ needs.deploy-backend.outputs.origin }}
          BACKEND_SUMMARY_DEPLOYMENT: ${{ needs.deploy-backend.outputs.deployment_id }}
        run: |
          {
            echo '## Production deployment evidence'
            echo "- Revision: $GITHUB_SHA"
            echo "- Frontend origin: $PUBLIC_ORIGIN"
            echo "- Frontend deployment: $DEPLOYMENT_ID"
            echo "- Backend origin: $BACKEND_SUMMARY_ORIGIN"
            echo "- Backend deployment: $BACKEND_SUMMARY_DEPLOYMENT"
            echo "- Rollback drill: $ROLLBACK_DRILL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment, Playwright, trace, and screenshot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-${{ github.sha }}
          path: |
            ${{ runner.temp }}/frontend-deployment/
            artifacts/deployment/
            frontend/playwright-production-report/
            frontend/test-results/production/
            frontend/test-results/production-junit.xml
          if-no-files-found: error
