name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The protected PR job names are backend, frontend, contract, security, and secrets.
# Renaming one silently removes a required check — update protection too.
jobs:
  configuration:
    # Repository secrets never enter pull-request code. This trusted-run job
    # validates the configured names without checking out or executing source.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require configured repository secrets
        shell: bash
        env:
          CLERK_PUBLIC_KEY: ${{ secrets.CLERK_PUBLIC_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_S3_API_ENDPOINT: ${{ secrets.CLOUDFLARE_S3_API_ENDPOINT }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          REDIS_ACCOUNT_API_KEY: ${{ secrets.REDIS_ACCOUNT_API_KEY }}
          REDIS_API_KEY: ${{ secrets.REDIS_API_KEY }}
          SOCRATA_API_KEY_ID: ${{ secrets.SOCRATA_API_KEY_ID }}
          SOCRATA_API_KEY_SECRET: ${{ secrets.SOCRATA_API_KEY_SECRET }}
          SOCRATA_APP_SECRET_TOKEN: ${{ secrets.SOCRATA_APP_SECRET_TOKEN }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          set -euo pipefail
          expected=(
            CLERK_PUBLIC_KEY
            CLERK_SECRET_KEY
            CLOUDFLARE_ACCESS_KEY_ID
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_S3_API_ENDPOINT
            CLOUDFLARE_SECRET_ACCESS_KEY
            FIRECRAWL_API_KEY
            GCP_API_KEY
            GOOGLE_AI_STUDIO_API_KEY
            HUGGINGFACE_API_KEY
            LANGSMITH_API_KEY
            LANGSMITH_PROJECT
            LANGSMITH_TRACING
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            OPEN_ROUTER_API_KEY
            RAILWAY_API_TOKEN
            RAILWAY_TOKEN
            RAILWAY_PROJECT_ID
            REDIS_ACCOUNT_API_KEY
            REDIS_API_KEY
            SOCRATA_API_KEY_ID
            SOCRATA_API_KEY_SECRET
            SOCRATA_APP_SECRET_TOKEN
            SOCRATA_APP_TOKEN
            TAVILY_API_KEY
          )
          missing=()
          for name in "${expected[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            for name in "${missing[@]}"; do
              printf '::error::missing repository secret: %s\n' "$name"
            done
            exit 1
          fi
          printf 'validated %d configured repository secret names\n' "${#expected[@]}"

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      REDIS_URL: redis://localhost:6379/0
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Validate shared API contract and golden responses
        run: uv run contracts/validate_contract.py

      - name: Test contract mock server
        run: python3 -m unittest discover -s contracts/tests -v

      # These checks are required on main from before backend/ exists, so the
      # PR that first creates it is not blocked by its own absence. See
      # docs/adr/0005-tests-never-call-the-live-api.md for why no test here
      # is permitted to reach the network.
      - id: probe
        run: |
          if [ -d backend ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "backend/ absent — nothing to test yet"; fi

      - name: Install
        if: steps.probe.outputs.present == 'true'
        working-directory: backend
        run: uv sync --frozen

      - name: Lock, format, lint, type, and migration-head checks
        if: steps.probe.outputs.present == 'true'
        working-directory: backend
        run: |
          set -euo pipefail
          uv lock --check
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy app
          test "$(uv run alembic heads | grep -c '(head)')" -eq 1

      - name: Unit, integration, migration, and contract tests with coverage
        if: steps.probe.outputs.present == 'true'
        working-directory: backend
        run: uv run pytest -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80

      - name: Production container migration and health smoke
        if: steps.probe.outputs.present == 'true'
        run: ./scripts/ci/backend_container_smoke.sh

      - name: Write backend gate summary
        if: always()
        env:
          GATE_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Backend gate'
            echo "- Status: $GATE_STATUS"
            echo '- Checks: lock, format, lint, types, one migration head, upgrade/idempotency, tests, coverage, Postgres/Redis, production container'
            echo '- Evidence: backend/coverage.xml and artifacts/backend-container/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backend evidence
        if: always() && steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-evidence
          path: |
            backend/coverage.xml
            artifacts/backend-container/
          # The backend step already fails closed. Missing evidence after an
          # early setup failure is diagnostic, not a second independent error.
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: probe
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "no frontend/package.json — nothing to build yet"; fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Format, lint, and type checks
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint
          npm run typecheck

      - name: Unit and component tests
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm run test:unit

      - name: Build
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Production-server Playwright at phone and desktop viewports
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm run test:e2e

      - name: Build Railway frontend container
        if: steps.probe.outputs.present == 'true'
        run: docker build -t nyc-events-frontend:ci frontend

      - name: Write frontend gate summary
        if: always()
        env:
          GATE_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Frontend gate'
            echo "- Status: $GATE_STATUS"
            echo '- Checks: format, lint, types, unit/component, build, phone/desktop Playwright, Railway container'
            echo '- Evidence: frontend/playwright-report/ and frontend/test-results/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload frontend evidence
        if: always() && steps.probe.outputs.present == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: error

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate OpenAPI, golden fixtures, and mock behavior
        run: |
          set -euo pipefail
          mkdir -p artifacts/contract
          uv run contracts/validate_contract.py | tee artifacts/contract/validation.txt
          python3 -m unittest discover -s contracts/tests -v 2>&1 | tee artifacts/contract/mock-tests.txt
      - name: Validate the frontend contract consumer
        working-directory: frontend
        run: |
          npm ci
          npm run test:unit -- app/data/api-contract.test.ts
      - name: Write contract gate summary
        if: always()
        env:
          GATE_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Contract gate'
            echo "- Status: $GATE_STATUS"
            echo '- Checks: OpenAPI, golden fixtures, mock server, backend responses, frontend consumer'
            echo '- Evidence: artifacts/contract/'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-evidence
          path: artifacts/contract/
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate workflow policy and syntax
        run: |
          set -euo pipefail
          uv run --with PyYAML==6.0.2 python -m unittest discover -s scripts/ci/tests -v
          python3 -m unittest discover -s scripts/deploy/tests -v
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          uvx --from zizmor==1.29.0 zizmor .github/workflows
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          uv lock --check
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file /tmp/backend-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit \
            --requirement /tmp/backend-requirements.txt --no-deps --disable-pip
      - name: Audit frontend dependencies and lock drift
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm audit --audit-level=high
          git diff --exit-code -- package-lock.json ../backend/uv.lock
      - name: Write security gate summary
        if: always()
        env:
          GATE_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Security gate'
            echo "- Status: $GATE_STATUS"
            echo '- Checks: workflow policy/actionlint/zizmor, pip-audit, npm audit, lock drift'
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Block committed credentials
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked — it must never be committed"; exit 1
          fi
          if git grep -nIE 'SOCRATA_(API_KEY_SECRET|APP_TOKEN)[[:space:]]*=[[:space:]]*[^[:space:]$]' -- ':!*.example' ':!.github/*'; then
            echo "::error::a Socrata credential appears to be hardcoded"; exit 1
          fi
          if git grep -nIE 'CLERK_SECRET_KEY[[:space:]]*=[[:space:]]*[^[:space:]$]' -- ':!*.example' ':!.github/*'; then
            echo "::error::CLERK_SECRET_KEY appears to be hardcoded"; exit 1
          fi
          if git grep -nIE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|gh[pousr]_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{32,})' -- ':!.github/workflows/ci.yml'; then
            echo "::error::a private key or provider token appears to be committed"; exit 1
          fi
          echo "no credentials found in tracked files"
