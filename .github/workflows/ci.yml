name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# The protected PR job names are backend, frontend, graph, and secrets.
# Renaming one silently removes a required check — update protection too.
jobs:
  configuration:
    # Repository secrets never enter pull-request code. This trusted-run job
    # validates the configured names without checking out or executing source.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require configured repository secrets
        shell: bash
        env:
          CLERK_PUBLIC_KEY: ${{ secrets.CLERK_PUBLIC_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_S3_API_ENDPOINT: ${{ secrets.CLOUDFLARE_S3_API_ENDPOINT }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GCP_API_KEY: ${{ secrets.GCP_API_KEY }}
          GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          REDIS_ACCOUNT_API_KEY: ${{ secrets.REDIS_ACCOUNT_API_KEY }}
          REDIS_API_KEY: ${{ secrets.REDIS_API_KEY }}
          SOCRATA_API_KEY_ID: ${{ secrets.SOCRATA_API_KEY_ID }}
          SOCRATA_API_KEY_SECRET: ${{ secrets.SOCRATA_API_KEY_SECRET }}
          SOCRATA_APP_SECRET_TOKEN: ${{ secrets.SOCRATA_APP_SECRET_TOKEN }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          set -euo pipefail
          expected=(
            CLERK_PUBLIC_KEY
            CLERK_SECRET_KEY
            CLOUDFLARE_ACCESS_KEY_ID
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_S3_API_ENDPOINT
            CLOUDFLARE_SECRET_ACCESS_KEY
            FIRECRAWL_API_KEY
            GCP_API_KEY
            GOOGLE_AI_STUDIO_API_KEY
            HUGGINGFACE_API_KEY
            LANGSMITH_API_KEY
            LANGSMITH_PROJECT
            LANGSMITH_TRACING
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            OPEN_ROUTER_API_KEY
            RAILWAY_API_TOKEN
            REDIS_ACCOUNT_API_KEY
            REDIS_API_KEY
            SOCRATA_API_KEY_ID
            SOCRATA_API_KEY_SECRET
            SOCRATA_APP_SECRET_TOKEN
            SOCRATA_APP_TOKEN
            TAVILY_API_KEY
          )
          missing=()
          for name in "${expected[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            for name in "${missing[@]}"; do
              printf '::error::missing repository secret: %s\n' "$name"
            done
            exit 1
          fi
          printf 'validated %d configured repository secret names\n' "${#expected[@]}"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Validate shared API contract and golden responses
        run: uv run contracts/validate_contract.py

      - name: Test contract mock server
        run: python3 -m unittest discover -s contracts/tests -v

      # These checks are required on main from before backend/ exists, so the
      # PR that first creates it is not blocked by its own absence. See
      # docs/adr/0005-tests-never-call-the-live-api.md for why no test here
      # is permitted to reach the network.
      - id: probe
        run: |
          if [ -d backend ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "backend/ absent — nothing to test yet"; fi

      - name: Install
        if: steps.probe.outputs.present == 'true'
        working-directory: backend
        run: uv sync --frozen

      - name: Test
        if: steps.probe.outputs.present == 'true'
        working-directory: backend
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: probe
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "no frontend/package.json — nothing to build yet"; fi

      - uses: actions/setup-node@v4
        if: steps.probe.outputs.present == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Test
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm test --if-present

      - name: Build
        if: steps.probe.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # PR merge refs have a synthetic commit and produce platform-specific
          # graph metadata. Rebuild the actual head branch instead.
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Install graphify
        run: uv tool install "graphifyy[mcp]==0.9.43"

      - name: Rebuild committed knowledge graph
        run: graphify update .

      - name: Commit canonical Linux graph when a repository PR is stale
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- \
            graphify-out/graph.json \
            graphify-out/graph.html \
            graphify-out/GRAPH_REPORT.md \
            graphify-out/.graphify_labels.json \
            graphify-out/.graphify_labels.json.sig \
            graphify-out/.graphify_root; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/graph.json graphify-out/graph.html \
            graphify-out/GRAPH_REPORT.md graphify-out/.graphify_labels.json \
            graphify-out/.graphify_labels.json.sig graphify-out/.graphify_root
          git commit -m "chore: rebuild the code knowledge graph"
          git push origin "HEAD:${{ github.head_ref }}"
          echo "::error::Graph outputs were stale and have been rebuilt; verify the new head run"
          exit 1

      - name: Verify committed knowledge graph is fresh
        run: |
          git diff --exit-code -- \
            graphify-out/graph.json \
            graphify-out/graph.html \
            graphify-out/GRAPH_REPORT.md \
            graphify-out/.graphify_labels.json \
            graphify-out/.graphify_labels.json.sig \
            graphify-out/.graphify_root

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block committed credentials
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked — it must never be committed"; exit 1
          fi
          if git grep -nIE 'SOCRATA_(API_KEY_SECRET|APP_TOKEN)[[:space:]]*=[[:space:]]*[^[:space:]$]' -- ':!*.example' ':!.github/*'; then
            echo "::error::a Socrata credential appears to be hardcoded"; exit 1
          fi
          echo "no credentials found in tracked files"
